# Codex on Amazon Bedrock, authenticated by the MicroVM's execution role (no API key).
# openai.gpt-5.5 is served by bedrock-mantle (Responses API) in us-east-1, so Codex calls that region.
model = "openai.gpt-5.5"
model_provider = "amazon-bedrock"

[model_providers.amazon-bedrock.aws]
region = "us-east-1"
